# 릴리즈 자동화 (명세서 2.5)
# - PR: Windows에서 테스트·빌드 성공 여부와, version.py 버전이 이미 릴리즈된 번호인지만 검사 (파일은 올리지 않음)
# - main에 병합(push): version.py 버전의 태그가 없을 때만 빌드 → 태그·Release 생성 → zip 첨부
#   이미 있는 버전이면 아무것도 하지 않는다.
# - 수동 실행(Run workflow): 시험 빌드만 (Release 없음)
# - 빌드 결과물은 Actions 저장소(artifact)에 올리지 않는다 (무료 저장 한도 문제). zip은 Release에만 첨부한다.
# 빌드에만 쓰고 데이터 수집에는 쓰지 않는다. API 키·GitHub Secrets를 쓰지 않는다.
name: build-windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 읽기, 이미 릴리즈된 버전인지 확인
        id: ver
        run: |
          $v = python -c "import collector.version as m; print(m.__version__)"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version.py 버전 형식 오류: $v" }
          $tag = "v$v"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($exists) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          Write-Output "version.py = $v, 태그 존재 = $([bool]$exists)"

      - name: PR 검사 - 버전을 올렸는지
        if: github.event_name == 'pull_request' && steps.ver.outputs.exists == 'true'
        run: throw "${{ steps.ver.outputs.tag }}는 이미 릴리즈된 버전입니다. collector/version.py의 버전을 올려주세요."

      - name: main 병합인데 이미 있는 버전 - 아무것도 하지 않음
        if: github.event_name == 'push' && steps.ver.outputs.exists == 'true'
        run: Write-Output "${{ steps.ver.outputs.tag }}가 이미 있어 릴리즈를 건너뜁니다."

      - name: 의존성 설치
        if: steps.ver.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements-dev.txt

      - name: 테스트 (실제 API 호출 없음)
        if: steps.ver.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: python -m pytest -q

      - name: PyInstaller 빌드 (--onedir)
        if: steps.ver.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name 주식데이터수집기 `
            --collect-data tzdata `
            run_collector.py

      - name: 실행 확인 (--version)
        if: steps.ver.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          $out = & "dist/주식데이터수집기/주식데이터수집기.exe" --version
          Write-Output $out
          if ($out -ne "${{ steps.ver.outputs.version }}") { throw "버전 불일치: $out" }

      - name: zip 만들기
        id: zip
        if: steps.ver.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          $name = "주식데이터수집기_${{ steps.ver.outputs.tag }}.zip"
          Copy-Item README.md "dist/주식데이터수집기/README.md"
          Compress-Archive -Path "dist/주식데이터수집기" -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: zip에 secret/·settings.env가 없는지 검사
        if: steps.zip.outputs.name != ''
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("${{ steps.zip.outputs.name }}")
          $bad = $zip.Entries | Where-Object { $_.FullName -match '(^|/|\\)secret(/|\\)' -or $_.FullName -match 'settings\.env$' -or $_.FullName -match 'keys\.env$' }
          $zip.Dispose()
          if ($bad) { $bad | ForEach-Object { $_.FullName }; throw "배포본에 넣으면 안 되는 파일이 있습니다." }

      - name: 태그·Release 생성, zip 첨부 (main 병합 + 새 버전일 때만)
        if: github.event_name == 'push' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.name }}
